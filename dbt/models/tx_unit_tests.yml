version: 2
unit_tests:
- name: tx_shares_keep_release_and_unknown_counts
  model: tx_contest_candidate_results
  given:
  - input: ref('stg_tx_results')
    rows:
    - release_id: 1
      source_id: tx_2026_general
      election_date: '2026-11-03'
      state: TX
      unit_type: state
      county: ''
      contest_id: TX-SEN
      choice: A
      choice_party: REP
      total_votes: 3
    - release_id: 1
      source_id: tx_2026_general
      election_date: '2026-11-03'
      state: TX
      unit_type: state
      county: ''
      contest_id: TX-SEN
      choice: B
      choice_party: REP
      total_votes: 7
    - release_id: 2
      source_id: tx_2026_general
      election_date: '2026-11-03'
      state: TX
      unit_type: state
      county: ''
      contest_id: TX-SEN
      choice: A
      choice_party: REP
      total_votes: null
  expect:
    rows:
    - release_id: 1
      choice: A
      total_votes: 3
      contest_votes: 10
      vote_share: '0.30000000000000000000'
    - release_id: 1
      choice: B
      total_votes: 7
      contest_votes: 10
      vote_share: '0.70000000000000000000'
    - release_id: 2
      choice: A
      total_votes: null
      contest_votes: null
      vote_share: null
