version: 2

models:
  - name: stg_nc_releases
    description: "Completed ingestion releases for the two NC sources; not publication decisions."
    columns:
      - name: release_id
        data_tests: [not_null, unique]

      - name: reference_status
        description: "Parser reference status; not proof of an independent audit."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [matched, not_provided, not_applicable]

      - name: all_counts_zero
        description: "Whether all parsed counts were zero; does not determine election status."
        data_tests: [not_null]

  - name: stg_nc_results
    description: "One release, county, reporting unit, contest and choice. Administrative units retained."
    data_tests:
      - unique_combination:
          arguments:
            columns: [release_id, county, reporting_unit, contest_id, choice]

      - nonnegative_columns:
          arguments:
            columns: [election_day, early_voting, absentee_by_mail, provisional, total_votes]

      - vote_methods_match_total

    columns:
      - name: contest_id
        data_tests:
          - accepted_values:
              arguments:
                values: "{{ var('nc_races') }}"

      - name: reporting_unit
        description: "Source precinct identifier as text, including administrative units."

  - name: stg_nc_absentee_demographics
    description: "One release and county demographic group. Registered party is not candidate choice."
    data_tests:
      - unique_combination:
          arguments:
            columns: [release_id, county, request_type, party_registration, sex, race, ethnicity]

      - nonnegative_columns:
          arguments:
            columns: [ballot_count]

  - name: nc_county_candidate_results
    description: "Candidate/choice counts by release, county and contest."
    data_tests:
      - unique_combination:
          arguments:
            columns: [release_id, county, contest_id, choice]

      - nonnegative_columns:
          arguments:
            columns: [election_day, early_voting, absentee_by_mail, provisional, total_votes]

      - vote_methods_match_total

      - reconciles_to:
          arguments:
            input_model: ref('stg_nc_results')
            dimensions: [release_id, source_id, election_date, state, county, contest_id, choice, choice_party]
            measures: [election_day, early_voting, absentee_by_mail, provisional, total_votes]

  - name: nc_contest_candidate_results
    description: "Candidate/choice totals and shares by release and contest. Not race calls."
    data_tests:
      - unique_combination:
          arguments:
            columns: [release_id, contest_id, choice]

      - nonnegative_columns:
          arguments:
            columns: [election_day, early_voting, absentee_by_mail, provisional, total_votes]

      - vote_methods_match_total
      - vote_shares_match_counts

      - reconciles_to:
          arguments:
            input_model: ref('stg_nc_results')
            dimensions: [release_id, source_id, election_date, state, contest_id, choice, choice_party]
            measures: [election_day, early_voting, absentee_by_mail, provisional, total_votes]

    columns:
      - name: vote_share
        description: "Fraction from 0 to 1 of reported candidate/choice votes; NULL when contest_votes is zero."

      - name: contest_votes
        description: "Candidate/choice votes within this release and contest, including write-ins."

  - name: nc_state_absentee_demographics
    description: "Statewide groups by release; source categories and missing demographics preserved."
    data_tests:
      - unique_combination:
          arguments:
            columns: [release_id, request_type, party_registration, sex, race, ethnicity]

      - nonnegative_columns:
          arguments:
            columns: [ballot_count]

      - reconciles_to:
          arguments:
            input_model: ref('stg_nc_absentee_demographics')
            dimensions: [release_id, source_id, election_date, state, request_type, party_registration, sex, race, ethnicity]
            measures: [ballot_count]
