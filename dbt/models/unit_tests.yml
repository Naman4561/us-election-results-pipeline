version: 2

unit_tests:
  - name: county_retains_administrative_units_and_separates_releases
    model: nc_county_candidate_results

    given:
      - input: ref('stg_nc_results')
        rows:
          - {release_id: 1, source_id: nc_2026_general, election_date: '2026-11-03', state: NC, county: WAKE, reporting_unit: '001', real_precinct: true, contest_id: NC-04, choice: A, choice_party: DEM, election_day: 2, early_voting: 0, absentee_by_mail: 0, provisional: 0, total_votes: 2}
          - {release_id: 1, source_id: nc_2026_general, election_date: '2026-11-03', state: NC, county: WAKE, reporting_unit: ABSENTEE, real_precinct: false, contest_id: NC-04, choice: A, choice_party: DEM, election_day: 0, early_voting: 3, absentee_by_mail: 0, provisional: 0, total_votes: 3}
          - {release_id: 2, source_id: nc_2026_general, election_date: '2026-11-03', state: NC, county: WAKE, reporting_unit: '001', real_precinct: true, contest_id: NC-04, choice: A, choice_party: DEM, election_day: 1, early_voting: 0, absentee_by_mail: 0, provisional: 0, total_votes: 1}

    expect:
      rows:
        - {release_id: 1, county: WAKE, contest_id: NC-04, choice: A, election_day: 2, early_voting: 3, total_votes: 5}
        - {release_id: 2, county: WAKE, contest_id: NC-04, choice: A, election_day: 1, early_voting: 0, total_votes: 1}

  - name: contest_shares_use_own_release_and_handle_zero_votes
    model: nc_contest_candidate_results

    given:
      - input: ref('nc_county_candidate_results')
        rows:
          - {release_id: 10, source_id: nc_2026_general, election_date: '2026-11-03', state: NC, county: WAKE, contest_id: NC-04, choice: A, choice_party: DEM, election_day: 3, early_voting: 0, absentee_by_mail: 0, provisional: 0, total_votes: 3}
          - {release_id: 10, source_id: nc_2026_general, election_date: '2026-11-03', state: NC, county: WAKE, contest_id: NC-04, choice: B, choice_party: REP, election_day: 7, early_voting: 0, absentee_by_mail: 0, provisional: 0, total_votes: 7}
          - {release_id: 11, source_id: nc_2026_general, election_date: '2026-11-03', state: NC, county: WAKE, contest_id: NC-04, choice: A, choice_party: DEM, election_day: 0, early_voting: 0, absentee_by_mail: 0, provisional: 0, total_votes: 0}
          - {release_id: 11, source_id: nc_2026_general, election_date: '2026-11-03', state: NC, county: WAKE, contest_id: NC-04, choice: B, choice_party: REP, election_day: 0, early_voting: 0, absentee_by_mail: 0, provisional: 0, total_votes: 0}

    expect:
      rows:
        - {release_id: 10, choice: A, total_votes: 3, contest_votes: 10, vote_share: "0.30000000000000000000"}
        - {release_id: 10, choice: B, total_votes: 7, contest_votes: 10, vote_share: "0.70000000000000000000"}
        - {release_id: 11, choice: A, total_votes: 0, contest_votes: 0, vote_share: null}
        - {release_id: 11, choice: B, total_votes: 0, contest_votes: 0, vote_share: null}
        
  - name: demographics_preserve_null_groups_categories_and_releases
    model: nc_state_absentee_demographics

    given:
      - input: ref('stg_nc_absentee_demographics')
        rows:
          - {release_id: 1, source_id: nc_absentee_early_demographics_2026, election_date: '2026-11-03', state: NC, county: WAKE, request_type: ONE-STOP, party_registration: null, sex: FEMALE, race: ASIAN, ethnicity: UNDESIGNATED, ballot_count: 7}
          - {release_id: 1, source_id: nc_absentee_early_demographics_2026, election_date: '2026-11-03', state: NC, county: DURHAM, request_type: ONE-STOP, party_registration: null, sex: FEMALE, race: ASIAN, ethnicity: UNDESIGNATED, ballot_count: 3}
          - {release_id: 1, source_id: nc_absentee_early_demographics_2026, election_date: '2026-11-03', state: NC, county: WAKE, request_type: CIVILIAN, party_registration: null, sex: FEMALE, race: ASIAN, ethnicity: UNDESIGNATED, ballot_count: 2}
          - {release_id: 2, source_id: nc_absentee_early_demographics_2026, election_date: '2026-11-03', state: NC, county: WAKE, request_type: ONE-STOP, party_registration: null, sex: FEMALE, race: ASIAN, ethnicity: UNDESIGNATED, ballot_count: 4}

    expect:
      rows:
        - {release_id: 1, request_type: ONE-STOP, party_registration: null, ballot_count: 10}
        - {release_id: 1, request_type: CIVILIAN, party_registration: null, ballot_count: 2}
        - {release_id: 2, request_type: ONE-STOP, party_registration: null, ballot_count: 4}