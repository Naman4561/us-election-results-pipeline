version: 2
models:
  - name: stg_ms_releases
    columns:
      - name: release_id
        data_tests: [not_null, unique]
      - name: expected_counties
        data_tests: [not_null]
      - name: configured_counties
        data_tests: [not_null]
  - name: stg_ms_results
    data_tests:
      - unique_combination:
          arguments:
            columns: [release_id, unit_type, county, contest_id, source_candidate_id]
  - name: stg_ms_county_feeds
    data_tests:
      - unique_combination:
          arguments:
            columns: [release_id, county]
      - unique_combination:
          arguments:
            columns: [release_id, county_fips]
  - name: ms_county_candidate_results
    data_tests:
      - unique_combination:
          arguments:
            columns: [release_id, county, contest_id, choice]
  - name: ms_contest_candidate_results
    data_tests:
      - unique_combination:
          arguments:
            columns: [release_id, contest_id, choice]
      - vote_shares_match_counts
  - name: ms_county_feed_status
    data_tests:
      - unique_combination:
          arguments:
            columns: [release_id, county]
