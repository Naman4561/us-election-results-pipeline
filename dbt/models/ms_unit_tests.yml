version: 2
unit_tests:
  - name: ms_shares_use_named_state_candidates_and_own_release
    model: ms_contest_candidate_results
    given:
      - input: ref('stg_ms_results')
        rows:
          - {release_id: 10, source_id: ms_2026_general, election_date: '2026-11-03', state: MS, unit_type: state, contest_id: MS-SEN, choice: Scott Colom, choice_party: DEM, total_votes: 3}
          - {release_id: 10, source_id: ms_2026_general, election_date: '2026-11-03', state: MS, unit_type: state, contest_id: MS-SEN, choice: Cindy Hyde-Smith, choice_party: REP, total_votes: 7}
          - {release_id: 10, source_id: ms_2026_general, election_date: '2026-11-03', state: MS, unit_type: state, contest_id: MS-SEN, choice: Ty Pinkins, choice_party: IND, total_votes: 0}
          - {release_id: 10, source_id: ms_2026_general, election_date: '2026-11-03', state: MS, unit_type: county, contest_id: MS-SEN, choice: Scott Colom, choice_party: DEM, total_votes: 2000}
          - {release_id: 11, source_id: ms_2026_general, election_date: '2026-11-03', state: MS, unit_type: state, contest_id: MS-SEN, choice: Scott Colom, choice_party: DEM, total_votes: 0}
    expect:
      rows:
        - {release_id: 10, choice: Scott Colom, total_votes: 3, contest_votes: 10, vote_share: '0.30000000000000000000'}
        - {release_id: 10, choice: Cindy Hyde-Smith, total_votes: 7, contest_votes: 10, vote_share: '0.70000000000000000000'}
        - {release_id: 10, choice: Ty Pinkins, total_votes: 0, contest_votes: 10, vote_share: '0.00000000000000000000'}
        - {release_id: 11, choice: Scott Colom, total_votes: 0, contest_votes: 0, vote_share: null}
