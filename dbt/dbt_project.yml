name: election_analytics
version: 2.0.0
config-version: 2
profile: election_analytics
require-dbt-version:
- '>=1.12.6'
- <1.13.0
model-paths:
- models
test-paths:
- tests
macro-paths:
- macros
clean-targets:
- target
- dbt_packages
# One release of one state is built per run. publication.build_candidate passes the
# release and the state's contract from election_pipeline.states.
vars:
  election_date: '2026-11-03'
  publication_release_id: null
  state: ''
  races: []
  methods: []
  # exact: county totals equal the official ones; masked: privacy-masked county rows
  # never exceed them; none: the state publishes no county results.
  county_reconciliation: none
# Every state builds the results models; Mississippi adds its county feeds, and North
# Carolina's absentee demographics are a dataset of their own.
models:
  election_analytics:
    +materialized: "{{ var('publication_materialization', 'view') }}"
    results:
      +tags:
      - results
      staging:
        +schema: staging
      marts:
        +schema: marts
    ms:
      +tags:
      - ms
      staging:
        +schema: staging
      marts:
        +schema: marts
    demographics:
      +tags:
      - demographics
      staging:
        +schema: staging
      marts:
        +schema: marts
