name: election_analytics
version: 1.0.0
config-version: 2
profile: election_analytics
require-dbt-version:
- '>=1.12.6'
- <1.13.0
model-paths:
- models
test-paths:
- tests
macro-paths:
- macros
clean-targets:
- target
- dbt_packages
vars:
  nc_results_source: nc_2026_general
  nc_demographics_source: nc_absentee_early_demographics_2026
  election_date: '2026-11-03'
  nc_races: [NC-SEN, NC-01, NC-03, NC-04, NC-11]
  mn_races: [MN-SEN, MN-01]
  ne_races: [NE-SEN, NE-GOV]
  tx_races: [TX-SEN, TX-GOV, TX-15, TX-23, TX-28, TX-34, TX-35]
  ky_results_source: ky_2026_general
  mn_results_source: mn_2026_general
  ne_results_source: ne_2026_general
  tx_results_source: tx_2026_general
  ga_results_source: ga_2026_general
  ga_races:
  - GA-SEN
  - GA-GOV
  - GA-01
  - GA-02
  - GA-03
  - GA-04
  - GA-05
  - GA-06
  - GA-07
  - GA-08
  - GA-09
  - GA-10
  - GA-11
  - GA-12
  - GA-13
  - GA-14
