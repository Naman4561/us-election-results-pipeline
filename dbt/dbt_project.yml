name: election_analytics
version: 1.0.0
config-version: 2
profile: election_analytics
require-dbt-version:
- '>=1.12.6'
- <1.13.0
model-paths:
- models
test-paths:
- tests
macro-paths:
- macros
clean-targets:
- target
- dbt_packages
vars:
  nc_results_source: nc_2026_general
  nc_demographics_source: nc_absentee_early_demographics_2026
  election_date: '2026-11-03'
  ky_results_source: ky_2026_general
  mn_results_source: mn_2026_general
  ne_results_source: ne_2026_general
  tx_results_source: tx_2026_general
models:
  election_analytics:
    +materialized: '{{ var(''publication_materialization'', ''view'') }}'
    staging:
      +schema: staging
      nc:
        +tags:
        - state_nc
      ky:
        +tags:
        - state_ky
      mn:
        +tags:
        - state_mn
      ne:
        +tags:
        - state_ne
      tx:
        +tags:
        - state_tx
    marts:
      +schema: marts
      nc:
        +tags:
        - state_nc
      ky:
        +tags:
        - state_ky
      mn:
        +tags:
        - state_mn
      ne:
        +tags:
        - state_ne
      tx:
        +tags:
        - state_tx
