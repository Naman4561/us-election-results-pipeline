  - KS-GOV
  - KS-01
  - KS-02
  - KS-03
  - KS-04
  oh_results_source: oh_2026_general
  oh_races:
  - OH-SEN
  - OH-GOV
  - OH-01
  - OH-02
  - OH-03
  - OH-04
  - OH-05
  - OH-06
  - OH-07
  - OH-08
  - OH-09
  - OH-10
  - OH-11
  - OH-12
  - OH-13
  - OH-14
  - OH-15
