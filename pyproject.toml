[build-system]
requires = ["setuptools==84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "us-election-results-pipeline"
version = "0.1.1"
description = "Collection and provenance of official U.S. election result files"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
postgres = [
    "psycopg[binary]==3.3.6",
    "python-dotenv==1.2.4",
]
transform = [
    "dbt-core==1.12.6",
    "dbt-postgres==1.11.0",
]
dashboard = ["fastapi==0.162.0", "uvicorn==0.54.0"]
deployment = ["pglast==8.7"]

[project.scripts]
election-collect = "election_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"election_pipeline" = ["resources/*.json", "resources/*.pem"]
"election_pipeline.dashboard" = [
    "static/*.html",
    "static/*.css",
    "static/*.js",
    "static/*.json",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
