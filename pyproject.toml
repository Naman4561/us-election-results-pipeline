[build-system]
requires = ["setuptools==84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "us-election-results-pipeline"
version = "0.1.1"
description = "Collection and provenance of official U.S. election result files"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
election-collect = "election_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
