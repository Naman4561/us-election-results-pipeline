expected_members = [
  "fed.csv",
  "sw.csv",
  "fed.html",
  "sw.html",
  "county-nm-01.xlsx",
  "county-nm-02.xlsx",
  "county-nm-03.xlsx",
  "county-nm-gov.xlsx",
  "county-nm-sen.xlsx",
]
supplemental_members = [
  "county-nm-01.xlsx",
  "county-nm-02.xlsx",
  "county-nm-03.xlsx",
  "county-nm-gov.xlsx",
  "county-nm-sen.xlsx",
]
