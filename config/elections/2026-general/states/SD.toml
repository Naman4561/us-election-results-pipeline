code = "SD"
methods = ["total_votes"]
collection_backend = "enr_export"

[races]
governor = true
house = [0]

[acquisition]
mode = "http"

[source]
id = "sd_2026_general"
page = "https://electionresults.sd.gov/"
url = "https://electionresults.sd.gov/resultsCSV.aspx?text=All&type=SWR&map=CTY"
format = "bundle"
primary_filename = "results.csv"
expected_members = ["results.csv", "export.html", "statewide.xlsx"]
supplemental_members = ["statewide.xlsx"]
collect_hours_utc = [1, 4, 7, 10, 13, 16, 19, 22]
min_interval_seconds = 600

[source.files]
"export.html" = "https://electionresults.sd.gov/ResultsExport.aspx"

[platform]
reader = "enr"
state_line = "State of South Dakota"
workbook_title = "2026 {} General Election Results"
status_label = "{} Results General Election November 3, 2026"
page_election = "General Election November 3, 2026"

[platform.titles]                  # the contest title as the site writes it
"United States Senator" = "SD-SEN"
"United States Representative" = "SD-AL"
"Governor and Lieutenant Governor" = "SD-GOV"
