[collector]
timeout_seconds = 30
max_download_seconds = 120
max_attempts = 3
backoff_seconds = 2
max_retry_wait_seconds = 30
max_download_bytes = 52428800
max_uncompressed_bytes = 268435456
max_zip_members = 20
max_csv_rows = 2000000
user_agent = "US-Election-Results-Pipeline/0.1"

[sources.nc_2026_general]
state = "NC"
election_date = "2026-11-03"
url = "https://s3.amazonaws.com/dl.ncsbe.gov/ENRS/2026_11_03/results_pct_20261103.zip"
format = "zip"
expected_members = ["results_pct_20261103.txt"]

[sources.nc_absentee_early_demographics_2026]
state = "NC"
election_date = "2026-11-03"
dataset = "absentee_early_demographics"
url = "https://s3.amazonaws.com/dl.ncsbe.gov/ENRS/2026_11_03/absentee_counts_county_20261103.csv"
format = "csv"
expected_columns = [
    "county_name",
    "abs_request_type",
    "party_cd",
    "gender",
    "race",
    "ethnicity",
    "0",
]

[sources.ky_2026_general]
state = "KY"
election_date = "2026-11-03"
url = "https://vrsws.sos.ky.gov/liveresults/Data/CurrentResultsExcludeLocal"
format = "bundle"
min_interval_seconds = 300
expected_members = ["results.xml", "election.xml", "parties.xml", "units.xml", "contests.xml", "candidates.xml"]

[sources.ky_2026_general.files]
"election.xml" = "https://vrsws.sos.ky.gov/liveresults/Data/Elections"
"parties.xml" = "https://vrsws.sos.ky.gov/liveresults/Data/PoliticalParties"
"units.xml" = "https://vrsws.sos.ky.gov/liveresults/Data/GeopoliticalUnits"
"contests.xml" = "https://vrsws.sos.ky.gov/liveresults/Data/Contests"
"candidates.xml" = "https://vrsws.sos.ky.gov/liveresults/Data/Candidates"

[sources.mn_2026_general]
state = "MN"
election_date = "2026-11-03"
url = "https://electionresultsfiles.sos.mn.gov/20261103/ussenatecty.txt"
format = "bundle"
primary_filename = "senate-county.txt"
min_interval_seconds = 300
expected_members = ["senate-county.txt", "senate.txt", "house-county.txt", "house.txt", "counties.txt"]

[sources.mn_2026_general.files]
"senate.txt" = "https://electionresultsfiles.sos.mn.gov/20261103/ussenate.txt"
"house-county.txt" = "https://electionresultsfiles.sos.mn.gov/20261103/USHouseCty.txt"
"house.txt" = "https://electionresultsfiles.sos.mn.gov/20261103/USHouse.txt"
"counties.txt" = "https://electionresultsfiles.sos.mn.gov/20261103/Cntytbl.txt"

[sources.ne_2026_general]
state = "NE"
election_date = "2026-11-03"
url = "https://electionresults.nebraska.gov/resultsCSV.aspx?map=CTY&text=All&type=SW"
format = "bundle"
primary_filename = "results.csv"
min_interval_seconds = 300
expected_members = ["results.csv", "election.html"]

[sources.ne_2026_general.files]
"election.html" = "https://electionresults.nebraska.gov/ResultsMedia.aspx"

[sources.tx_2026_general]
state = "TX"
election_date = "2026-11-03"
url = "https://goelect.txelections.civixapps.com/api-ivis-system/api/s3/enr/election/53815"
format = "bundle"
primary_filename = "results.json"
min_interval_seconds = 300
expected_members = ["results.json"]

[sources.ga_2026_general]
state = "GA"
election_date = "2026-11-03"
url = "https://results.sos.ga.gov/results/public/api/elections/Georgia/11032026GeneralAndSpecialElection/data"
format = "bundle"
primary_filename = "results.json"
min_interval_seconds = 300
expected_members = ["results.json"]

[sources.ks_2026_general]
state = "KS"
election_date = "2026-11-03"
url = "https://ent.sos.ks.gov/kssos_ent.html"
format = "bundle"
primary_filename = "results.html"
min_interval_seconds = 300
expected_members = ["results.html"]

[sources.oh_2026_general]
state = "OH"
election_date = "2026-11-03"
url = "https://liveresults.ohiosos.gov/Api/v1/download?filename=VSSC1622XmlFileBlob"
format = "bundle"
primary_filename = "results.xml"
min_interval_seconds = 300
expected_members = ["results.xml"]

# The SC resolver selects the newest dated workbook linked by this official page.
# Both the index and exact workbook bytes are archived for offline replay.
[sources.sc_2026_general]
state = "SC"
election_date = "2026-11-03"
url = "https://scvotes.gov/2026-general-election-results/"
format = "bundle"
primary_filename = "results.xlsx"
min_interval_seconds = 300
expected_members = ["index.html", "results.xlsx"]

[sources.sc_2026_general.files]
"index.html" = "https://scvotes.gov/2026-general-election-results/"
