[collector]
timeout_seconds = 30
max_download_seconds = 120
max_attempts = 3
backoff_seconds = 2
max_retry_wait_seconds = 30
max_download_bytes = 52428800
max_uncompressed_bytes = 268435456
max_zip_members = 20
max_csv_rows = 2000000
user_agent = "US-Election-Results-Pipeline/0.1"

[sources.nc_2026_general]
state = "NC"
election_date = "2026-11-03"
url = "https://s3.amazonaws.com/dl.ncsbe.gov/ENRS/2026_11_03/results_pct_20261103.zip"
format = "zip"
expected_members = ["results_pct_20261103.txt"]

[sources.nc_absentee_early_demographics_2026]
state = "NC"
election_date = "2026-11-03"
dataset = "absentee_early_demographics"
url = "https://s3.amazonaws.com/dl.ncsbe.gov/ENRS/2026_11_03/absentee_counts_county_20261103.csv"
format = "csv"
expected_columns = [
    "county_name",
    "abs_request_type",
    "party_cd",
    "gender",
    "race",
    "ethnicity",
    "0",
]

[sources.ky_2026_general]
state = "KY"
election_date = "2026-11-03"
url = "https://vrsws.sos.ky.gov/liveresults/Data/CurrentResultsExcludeLocal"
format = "bundle"
min_interval_seconds = 300
expected_members = ["results.xml", "election.xml", "parties.xml", "units.xml", "contests.xml", "candidates.xml"]

[sources.ky_2026_general.files]
"election.xml" = "https://vrsws.sos.ky.gov/liveresults/Data/Elections"
"parties.xml" = "https://vrsws.sos.ky.gov/liveresults/Data/PoliticalParties"
"units.xml" = "https://vrsws.sos.ky.gov/liveresults/Data/GeopoliticalUnits"
"contests.xml" = "https://vrsws.sos.ky.gov/liveresults/Data/Contests"
"candidates.xml" = "https://vrsws.sos.ky.gov/liveresults/Data/Candidates"
