[collector]
timeout_seconds = 30
max_download_seconds = 120
max_attempts = 3
backoff_seconds = 2
max_retry_wait_seconds = 30
max_download_bytes = 52428800
max_uncompressed_bytes = 268435456
max_zip_members = 20
max_csv_rows = 2000000
user_agent = "US-Election-Results-Pipeline/0.1"

# A source still counting is collected every 15 minutes. One whose count has stopped is
# collected hourly (3540 s), or every three hours at hours clear of the backups, which
# start at 00:02, 06:02, 12:02 and 18:02 UTC and take about half an hour. The worker runs
# every 5 minutes, and 840 s (not 900) or 3540 s (not 3600) keeps a source checked a few
# seconds later in one cycle than the last from slipping a cycle.

