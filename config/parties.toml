# The party codes a platform's sites publish under, reviewed once, by platform.
#
# Each table maps a party name exactly as the platform writes it to the code stored in
# results (DEM, REP, LIB, GRN, IND, CON ...). A reader refuses a party it does not list:
# a new spelling is added here, with its source in the commit message, never guessed.
# Changing this file re-keys the release check of every state whose definition has a
# [platform] table (elections.fingerprint).

[tally]
"Republican" = "REP"
"Democratic" = "DEM"
"Democratic-NPL" = "DEM"
"Libertarian" = "LIB"
"Green" = "GRN"
"Independent" = "IND"
"independent nomination" = "IND"
"Constitution" = "CON"
"American Delta" = "ADP"
"Write-In" = "W"
# Stored as the code this reader has always produced for it (the name, uppercased). A
# shorter code is a separate, reviewed change: it alters stored results.
"Nonpartisan" = "NONPARTISAN"

[enhanced_voting]                    # for a site that names its parties without abbreviations
"Democratic" = "DEM"                 # (party_names = true in its [platform]): Utah's
"Republican" = "REP"
"Libertarian" = "LIB"
"Constitution" = "CON"
"Forward" = "FWD"
"Independent American" = "IAP"
"Unaffiliated" = "UNA"

[enr.MT]                             # Montana's export prints each party's name
"Republican" = "REP"
"Democrat" = "DEM"
"Libertarian" = "LIB"
"Green" = "GRN"
"Independent" = "IND"

[enr.OR]                             # Oregon's nominating-party names
"Democrat" = "DEM"
"Republican" = "REP"
"Libertarian" = "LIB"
"Pacific Green" = "GRN"

