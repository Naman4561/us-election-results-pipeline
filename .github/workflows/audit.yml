name: Dependency audit
# Known vulnerabilities in the pinned Python packages (constraints.txt, what the image and
# CI install) and the dashboard checks' npm packages. Runs on every push and weekly, so a
# newly published advisory is reported even when nothing changes. It does not hold a
# release (ship_release.sh waits for the jobs in ci.yml only): a fix is a regenerated
# constraints.txt, reviewed like any change.
on:
  push:
  pull_request:
  schedule:
    - cron: "17 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: python -m pip install pip-audit==2.9.0
      - run: python -m pip_audit --requirement constraints.txt --no-deps --disable-pip --strict

  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
      - run: npm audit --audit-level=moderate
