name: Collection checks
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -c constraints.txt -e ".[postgres,transform,dashboard,deployment]" -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee unittest.log
      # Job logs need a GitHub login; annotations are public, so failures are readable
      # from the checks API too.
      - name: Annotate test failures
        if: failure()
        shell: bash
        run: |
          [ -f unittest.log ] || exit 0
          grep -E -A25 "^(FAIL|ERROR):" unittest.log | head -150 | tr -d '\r' \
            | python -c "import sys; t = sys.stdin.read().replace('%', '%25').replace('\n', '%0A'); print('::error title=Unit test failures::' + (t or 'none parsed; see the log'))"

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: python -m pip install -c constraints.txt -e ".[postgres,dashboard]" -r requirements-dev.txt
      - run: npm ci
      - run: npm run format:check
      - run: npm test

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: election_dev
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-disposable-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d election_dev"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_DB: election_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci-disposable-password
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -c constraints.txt -e ".[postgres,transform,dashboard,deployment]" -r requirements-dev.txt
      - name: Database tests
        shell: bash
        run: |
          set -o pipefail
          python scripts/check_pipeline.py 2>&1 | tee unittest.log
      - name: Annotate test failures
        if: failure()
        shell: bash
        run: |
          [ -f unittest.log ] || exit 0
          grep -E -A25 "^(FAIL|ERROR):" unittest.log | head -150 | tr -d '\r' \
            | python -c "import sys; t = sys.stdin.read().replace('%', '%25').replace('\n', '%0A'); print('::error title=Database test failures::' + (t or 'none parsed; see the log'))"
